name: Бот смен

on:
  schedule:
    # Каждые 5 минут — минимальный интервал, который допускает GitHub.
    # Фактический запуск он нередко задерживает ещё на 5–15 минут.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Два запуска одновременно не нужны: очередь Green API одна на всех.
concurrency:
  group: shift-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Тик бота
        run: node bot/tick.cjs
        env:
          # Крутимся 4 минуты, чтобы следующий запуск не наложился.
          RUN_SECONDS: "240"
          # Не обязательны: если пусто, берутся значения из assets/config.js.
          # Заполните эти секреты, только если захотите убрать ключи из репозитория.
          MOKKY_URL: ${{ secrets.MOKKY_URL }}
          GREEN_ID: ${{ secrets.GREEN_ID }}
          GREEN_TOKEN: ${{ secrets.GREEN_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Смены менеджеров</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="hdr">
        <div class="hdr__row">
          <h1>Смены менеджеров</h1>
          <a class="btn btn--ghost btn--sm" href="admin.html">Админка</a>
        </div>
        <div class="hdr__sub" id="todayLine">Загрузка…</div>
      </header>

      <div id="setupBanner" hidden class="banner">
        <b>Не заполнены ключи.</b> Откройте <code>assets/config.js</code> и укажите
        <code>MOKKY_URL</code>, <code>GREEN_ID</code> и <code>GREEN_TOKEN</code>.
      </div>

      <div class="status" id="botStatus">
        <span class="status__dot"></span><span id="botStatusText">Бот не запущен</span>
      </div>

      <section class="card">
        <div class="monthbar">
          <button class="btn btn--soft btn--sm" id="prevM">← Пред</button>
          <span class="monthbar__label" id="monthLabel"></span>
          <button class="btn btn--soft btn--sm" id="nextM">След →</button>
        </div>
        <div class="weekdays" id="weekdays"></div>
        <div class="grid" id="calendar"></div>
      </section>

      <section class="totals" id="totals"></section>
    </div>

    <script src="assets/config.js"></script>
    <script src="assets/util.js"></script>
    <script src="assets/db.js"></script>
    <script src="assets/green.js"></script>
    <script src="assets/calendar.js"></script>
    <script src="assets/bot.js"></script>
    <script src="assets/home.js"></script>
  </body>
</html>
